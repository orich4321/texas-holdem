services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: texas_holdem_persistence_test
      POSTGRES_USER: persistence_test
      POSTGRES_PASSWORD: persistence_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U persistence_test -d texas_holdem_persistence_test"]
      interval: 2s
      timeout: 3s
      retries: 15
